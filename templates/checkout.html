{% extends 'base.html' %}

{% block content %}
<div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="glass-card w-full max-w-lg border-[#ff7900] border overflow-hidden relative shadow-[0_0_50px_rgba(255,121,0,0.2)]">
        
        <div class="p-8 text-center border-b border-white/10">
            <div class="w-16 h-16 bg-[#ff7900]/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-[#ff7900]" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </div>
            <p class="text-[10px] uppercase tracking-[4px] text-gray-500 mb-1">Selected Plan</p>
            <h2 id="display-plan-name" class="text-3xl font-black italic text-white uppercase">Power User</h2>
        </div>

        <div class="bg-[#ff7900]/5 py-8 text-center">
            <div class="text-5xl font-black text-[#ff7900] tracking-tighter">
                <span class="text-lg mr-1">SLE</span><span id="display-plan-price">199</span>
            </div>
        </div>

        <form method="POST" action="{% url 'payment_instructions' %}" class="p-8 space-y-6">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div class="relative">
                    <input type="text" name="fullName" required placeholder="FULL NAME" 
                           class="w-full bg-white/5 border border-white/10 rounded-xl p-5 text-white placeholder:text-gray-600 focus:border-[#ff7900] outline-none transition-all font-bold">
                </div>

                <div class="relative flex gap-2">
                    <div class="bg-white/5 border border-white/10 rounded-xl px-4 flex items-center text-gray-400 font-bold">+232</div>
                    <input type="tel" name="phone" required placeholder="ORANGE NUMBER" 
                           class="flex-grow bg-white/5 border border-white/10 rounded-xl p-5 text-white placeholder:text-gray-600 focus:border-[#ff7900] outline-none transition-all font-bold">
                </div>
            </div>

            <button type="submit" class="w-full bg-[#ff7900] text-white font-black py-5 rounded-2xl flex items-center justify-center gap-3 hover:scale-[1.02] transition-transform shadow-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
                PAY WITH ORANGE MAX IT
            </button>

            <a href="{% url 'index' %}" class="block text-center text-[10px] text-gray-600 uppercase tracking-widest hover:text-gray-400">Cancel Transaction</a>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const kit = urlParams.get('kit') || 'power';
        
        const products = {
            'lite': { name: 'Lite Pass', price: 49 },
            'social': { name: 'Social Plus', price: 99 },
            'power': { name: 'Power User', price: 199 },
            'streamer': { name: 'Streamer', price: 250 },
            'elite': { name: 'Elite Pass', price: 299 }
        };

        const selected = products[kit] || products['power'];
        document.getElementById('display-plan-name').innerText = selected.name;
        document.getElementById('display-plan-price').innerText = selected.price;
    });
</script>
{% endblock %}
